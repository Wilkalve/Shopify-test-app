# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration


name = "Novaprint 3D Printing"
client_id = "47c3becbd20d6fb0c7387c1c11886854"
handle = "3d-v2-printing"
application_url = "https://cheat-decorating-ap-chi.trycloudflare.com"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[auth]
redirect_urls = ["https://cheat-decorating-ap-chi.trycloudflare.com/auth/callback", "https://cheat-decorating-ap-chi.trycloudflare.com/auth/shopify/callback", "https://cheat-decorating-ap-chi.trycloudflare.com/api/auth/callback"]

[pos]
embedded = false

export default {
  // other config...
  server: {
    env: ["SHOPIFY_API_KEY"]
  },
  public: {
    env: ["SHOPIFY_API_KEY"]
  }
};
